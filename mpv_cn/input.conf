# ══════════════════════════════════════════════════════════════════
# 中文界面增强（mpv_cn/input_cn.conf）
#
# 用 --input-conf= 显式指定；mpv 内置默认键位仍生效，本文件只做叠加。
#
# ⚠ 本文件里的命令**全部照抄 mpv 的真实默认绑定**（用 input-bindings 属性实测），
#   只在其后补一句中文 show-text。不要凭 etc/input.conf 猜 —— 那个文件整篇都是注释。
#   实测的默认值示例：0/9 = 音量 ∓2（不是 5）；UP/DOWN = seek ±60（不是音量）；
#   Ctrl+RIGHT = 字幕跳转（不是快进 60 秒）。
#
# 右键菜单**不需要在这里绑定**：MBTN_RIGHT 默认已是
#   script-binding select/context-menu
# 菜单条目内容由 mpv_cn/menu.conf 提供。
# ══════════════════════════════════════════════════════════════════

# ── 把默认的英文 OSD 提示换成中文（命令与默认一致，只加 show-text）──
m               cycle mute            ; show-text "静音：${mute}"
j               cycle sub             ; show-text "字幕：${sid}"
0               add volume  2         ; show-text "音量：${volume}%"
9               add volume -2         ; show-text "音量：${volume}%"
[               multiply speed 1/1.1  ; show-text "速度：${speed} 倍"
]               multiply speed 1.1    ; show-text "速度：${speed} 倍"
s               screenshot            ; show-text "已截图"
UP              seek  60              ; show-text "快进 1 分钟"
DOWN            seek -60              ; show-text "后退 1 分钟"
PGUP            add chapter  1        ; show-text "下一章节"
PGDWN           add chapter -1        ; show-text "上一章节"
Shift+RIGHT     no-osd seek  1 exact  ; show-text "快进 1 秒"
Shift+LEFT      no-osd seek -1 exact  ; show-text "后退 1 秒"
Ctrl+RIGHT      no-osd sub-seek  1    ; show-text "下一条字幕"
Ctrl+LEFT       no-osd sub-seek -1    ; show-text "上一条字幕"
f               cycle fullscreen      ; show-text "全屏切换"

# ── 实测未被占用的键（可安全新增）────────────────────────────────
a               cycle audio           ; show-text "音轨：${aid}"
# 按 n 看实时处理状态 —— 输出尺寸 / 滤镜实际帧率 / 丢帧数 / 音画差
# ★ A-V 是关键判别量（2026-09-30 加）：
#   · A-V 明显非零（±1~9 秒）→ 视频链路供不上、在丢帧（画面会一跳一跳）
#   · A-V ≈0 却仍觉得错位  → 错在 mpv 看不见的域（帧时长元数据 / 出声延迟）
n               show-text "输出 ${width}×${height}　实际 ${estimated-vf-fps} fps　丢帧 ${frame-drop-count}　A-V ${avsync}　${time-pos} / ${duration}"

# ── 中文统计页（外挂 stats_zh.lua，与内置英文 stats.lua 并存）────────
# 为什么不直接覆盖内置：外部脚本与内置同名时会被内置顶掉（实测），
# 所以给中文版独立脚本名 stats_zh，再让 i / I 指向它。
i               script-binding stats_zh/display-stats         ; show-text "统计信息（中文）"
I               script-binding stats_zh/display-stats-toggle  ; show-text "统计信息常驻（中文）"

# ── 音画微调（蓝牙音箱 / 无线耳机的渲染延迟补偿）──────────
# 为什么需要：蓝牙输出在 mpv 的音频时钟**之外**还有一层缓冲
#   （常态 150~300ms），mpv 看不到那一层 → 表现为「画面快过声音」，
#   而丢帧 0、avsync 恒 0、**单独超分 / 单独补帧一样偏** —— 这种偏移只能按耳朵校准。
# 用法：一边播一边按 ALT+←/→，屏幕上显示当前值，直到口型对上；
#   按 ALT+↑ 归零。找到的数值告诉我，我写进 live_play.bat 的
#   LIVE_AUDIO_DELAY 永久生效。
ALT+RIGHT       add audio-delay  0.02   ; show-text "音画微调 audio-delay = ${audio-delay} 秒（值越大＝声音越晚）"
ALT+LEFT        add audio-delay -0.02   ; show-text "音画微调 audio-delay = ${audio-delay} 秒（值越大＝声音越晚）"
ALT+UP          set audio-delay  0      ; show-text "audio-delay 已归零"
